name: Erdős 625 attained partial weight identification

on:
  pull_request:
    paths:
      - "625/formalization/Erdos625/Section8MatchingDemandCellFibre.lean"
      - "625/formalization/Erdos625/Section8ProfilePartialAggregateWeight.lean"
      - "625/proofs/SECTION8_ATTAINED_PARTIAL_WEIGHT_IDENTIFICATION.md"
      - "625/experiments/section8_attained_partial_weight_identity.py"
      - ".github/workflows/erdos625-attained-partial-weight-identification.yml"
  workflow_dispatch:

concurrency:
  group: erdos625-attained-partial-weight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-lean-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          files=(
            625/formalization/Erdos625/Section8MatchingDemandCellFibre.lean
          )
          if [[ -f 625/formalization/Erdos625/Section8ProfilePartialAggregateWeight.lean ]]; then
            files+=(625/formalization/Erdos625/Section8ProfilePartialAggregateWeight.lean)
          fi
          if grep -nE \
            '(^|[[:space:]])(sorry|admit|sorryAx)([[:space:][:punct:]]|$)|^[[:space:]]*(axiom|constant|unsafe)[[:space:]]' \
            "${files[@]}"; then
              exit 1
          fi
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: 625/formalization
          auto-config: false
          build: false
          use-mathlib-cache: true
          use-github-cache: false
          nanoda: false
      - name: Build the deepest present identification module warning-fatally
        working-directory: 625/formalization
        shell: bash
        run: |
          if [[ -f Erdos625/Section8ProfilePartialAggregateWeight.lean ]]; then
            target=Erdos625.Section8ProfilePartialAggregateWeight
          else
            target=Erdos625.Section8MatchingDemandCellFibre
          fi
          set +e
          lake build "$target" --wfail \
            > /tmp/erdos625-attained-partial-weight.log 2>&1
          status=$?
          tail -n 900 /tmp/erdos625-attained-partial-weight.log
          exit $status
      - name: Upload focused Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erdos625-attained-partial-weight-lean-log
          path: /tmp/erdos625-attained-partial-weight.log
          if-no-files-found: ignore

  exact-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Run exact regression when present
        shell: bash
        run: |
          if [[ -f 625/experiments/section8_attained_partial_weight_identity.py ]]; then
            python -m py_compile 625/experiments/section8_attained_partial_weight_identity.py
            python 625/experiments/section8_attained_partial_weight_identity.py
            python -O 625/experiments/section8_attained_partial_weight_identity.py
          else
            echo "Exact regression will be added with the weight-identification layer."
          fi
