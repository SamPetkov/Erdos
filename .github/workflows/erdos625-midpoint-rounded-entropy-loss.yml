name: Erdős 625 midpoint rounded entropy loss

on:
  pull_request:
    paths:
      - "625/formalization/Erdos625/MidpointRoundedFourSizeEntropyLoss.lean"
      - ".github/workflows/erdos625-midpoint-rounded-entropy-loss.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-lean-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          if grep -nE \
            '(^|[[:space:]])(sorry|admit|sorryAx)([[:space:][:punct:]]|$)|^[[:space:]]*(axiom|constant|unsafe)[[:space:]]' \
            625/formalization/Erdos625/MidpointRoundedFourSizeEntropyLoss.lean; then
            exit 1
          fi
      - id: lean_build
        continue-on-error: true
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: 625/formalization
          auto-config: false
          build: true
          build-args: --wfail Erdos625.MidpointRoundedFourSizeEntropyLoss
          use-mathlib-cache: true
          use-github-cache: false
          nanoda: false
      - name: Capture concise Lean diagnostics
        if: steps.lean_build.outcome == 'failure'
        working-directory: 625/formalization
        shell: bash
        run: |
          set +e
          lake build --wfail Erdos625.MidpointRoundedFourSizeEntropyLoss \
            > lean-build.log 2>&1
          status=$?
          grep -nE 'error:|unsolved goals|type mismatch|application type mismatch|unknown constant|declaration uses' \
            lean-build.log > lean-errors.txt || true
          tail -n 240 lean-build.log > lean-tail.txt
          printf '%s\n' "$status" > lean-status.txt
          cat lean-errors.txt
      - id: axiom_audit
        name: Replay and audit theorem axioms
        if: steps.lean_build.outcome == 'success'
        continue-on-error: true
        working-directory: 625/formalization
        shell: bash
        run: |
          set +e
          lake env lean Erdos625/MidpointRoundedFourSizeEntropyLoss.lean \
            > lean-axioms.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > lean-axiom-status.txt
          cat lean-axioms.log
          test "$status" -eq 0
          if grep -Fq 'sorryAx' lean-axioms.log; then
            echo 'forbidden sorryAx dependency detected'
            exit 1
          fi
          for declaration in \
            midpointRoundedFourSizeEntropyLoss_eq_sum_mul_log_div \
            mul_midpointRoundedProportion_sub_optimizer_sq_div_le \
            mul_sum_midpointRoundedProportion_sub_optimizer_sq_div_le \
            midpointRoundedFourSizeEntropy_loss_le \
            abs_mul_midpointRoundedFourSizeEntropyLoss_le; do
            grep -Fq "$declaration" lean-axioms.log || {
              echo "missing axiom report for $declaration"
              exit 1
            }
          done
      - name: Upload Lean diagnostics
        if: always() && (steps.lean_build.outcome == 'failure' || steps.axiom_audit.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: midpoint-rounded-entropy-loss-lean-diagnostics
          if-no-files-found: ignore
          path: |
            625/formalization/lean-build.log
            625/formalization/lean-errors.txt
            625/formalization/lean-tail.txt
            625/formalization/lean-status.txt
            625/formalization/lean-axioms.log
            625/formalization/lean-axiom-status.txt
      - name: Stop after validation failure
        if: steps.lean_build.outcome == 'failure' || steps.axiom_audit.outcome == 'failure'
        run: exit 1
