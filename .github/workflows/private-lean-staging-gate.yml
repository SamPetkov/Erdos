name: Private Lean staging gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Identify and audit changed Lean files
        id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if test -n "${BASE_SHA:-}" && test -n "${HEAD_SHA:-}"; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.lean' \
              > changed-lean-files.txt
          else
            git ls-files '*.lean' > changed-lean-files.txt
          fi
          cat changed-lean-files.txt
          while IFS= read -r file; do
            test -z "$file" && continue
            test -f "$file"
            if grep -nE \
              '(^|[[:space:]])(sorry|admit|sorryAx)([[:space:][:punct:]]|$)|^[[:space:]]*(axiom|constant|unsafe)[[:space:]]' \
              "$file"; then
              echo "Rejected placeholder or project-defined trust escape in $file" >&2
              exit 1
            fi
          done < changed-lean-files.txt

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: .
          auto-config: false
          build: true
          build-args: --wfail
          use-mathlib-cache: true
          use-github-cache: false
          nanoda: false

      - name: Compile changed Lean files warning-fatally
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            test -z "$file" && continue
            lake env lean -DwarningAsError=true "$file"
          done < changed-lean-files.txt

      - name: Preserve exact audit inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-lean-staging-audit-${{ github.run_id }}
          path: changed-lean-files.txt
          if-no-files-found: warn
          retention-days: 14
