name: Aristotle quarantined proof search

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "Repository-relative path to a reviewed, minimal Lean project"
        required: true
        type: string
      prompt:
        description: "Exact theorem-scoped request; include acceptance constraints"
        required: true
        type: string

permissions:
  contents: read

jobs:
  proof-search:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate isolated input
        env:
          PROJECT_DIR: ${{ inputs.project_dir }}
        run: |
          test "$PROJECT_DIR" != "."
          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/lakefile.toml" -o -f "$PROJECT_DIR/lakefile.lean"
      - name: Install Aristotle CLI
        run: python -m pip install --disable-pip-version-check aristotlelib
      - name: Submit quarantined proof-search request
        env:
          ARISTOTLE_API_KEY: ${{ secrets.ARISTOTLE_API_KEY }}
          PROJECT_DIR: ${{ inputs.project_dir }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          test -n "$ARISTOTLE_API_KEY"
          aristotle submit "$PROMPT" --project-dir "$PROJECT_DIR" --wait --destination aristotle-result.tar.gz
      - name: Preserve result for local review
        uses: actions/upload-artifact@v4
        with:
          name: aristotle-quarantined-result
          path: aristotle-result.tar.gz
          if-no-files-found: error
          retention-days: 14
