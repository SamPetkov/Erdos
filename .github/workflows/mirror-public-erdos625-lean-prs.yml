name: Mirror and validate active public Erdős 625 Lean PRs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-public-erdos625-lean-prs.yml"

permissions:
  contents: write
  statuses: write

concurrency:
  group: mirror-public-erdos625-lean-prs
  cancel-in-progress: false

jobs:
  mirror-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: main

      - name: Prepare and verify the private base project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: .
          auto-config: false
          build: true
          build-args: --wfail
          use-mathlib-cache: true
          use-github-cache: false
          nanoda: false

      - name: Mirror, validate, and status public PR heads
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p mirror-validation-logs
          public_url="https://github.com/SamPetkov/Erdos.git"
          git remote add public "$public_url"
          for pr in 34 35 36 37; do
            git fetch --no-tags public \
              "+refs/pull/$pr/head:refs/remotes/public/pr-$pr"
          done

          private_main="$(git rev-parse HEAD)"
          any_failed=0

          publish_status() {
            local sha="$1"
            local state="$2"
            local description="$3"
            local target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            STATE="$state" DESCRIPTION="$description" TARGET_URL="$target_url" \
              python - <<'PY' > commit-status.json
          import json
          import os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "private-lean/mirror-validation",
              "description": os.environ["DESCRIPTION"][:140],
              "target_url": os.environ["TARGET_URL"],
          }))
          PY
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/$sha" \
              --data-binary @commit-status.json
          }

          stage_pr() {
            local pr="$1"
            local branch="$2"
            local base_ref="$3"
            shift 3

            git switch --detach "$base_ref"
            git switch -C "$branch"

            local spec src dst
            for spec in "$@"; do
              src="${spec%%::*}"
              dst="${spec#*::}"
              mkdir -p "$(dirname "$dst")"
              git show "refs/remotes/public/pr-$pr:$src" > "$dst"
            done

            mapfile -t changed_lean < <(
              git diff --name-only "$base_ref" -- '*.lean'
            )
            printf '%s\n' "${changed_lean[@]}" \
              > "mirror-validation-logs/pr-$pr-changed-lean.txt"

            local log="mirror-validation-logs/pr-$pr-validation.log"
            set +e
            (
              set -euo pipefail
              for file in "${changed_lean[@]}"; do
                test -z "$file" && continue
                test -f "$file"
                # The compiler checks `sorry`/`admit` under --wfail. Keep the
                # textual gate only for actual trust-expanding declarations,
                # so ordinary prose such as "the bounds admit..." is harmless.
                if grep -nE \
                  '^[[:space:]]*(axiom|constant|unsafe)[[:space:]]' \
                  "$file"; then
                  echo "Rejected project-defined trust escape in $file" >&2
                  exit 1
                fi
              done
              lake build --wfail
              for file in "${changed_lean[@]}"; do
                test -z "$file" && continue
                lake env lean -DwarningAsError=true "$file"
              done
            ) > "$log" 2>&1
            local validation_rc=$?
            set -e

            local validation_state validation_description
            if test "$validation_rc" -eq 0; then
              validation_state="success"
              validation_description="Private Lean build and changed-module audit passed"
            else
              validation_state="failure"
              validation_description="Private Lean build or changed-module audit failed"
              any_failed=1
            fi

            mkdir -p .private-staging
            source_sha="$(git rev-parse "refs/remotes/public/pr-$pr")"
            cat > ".private-staging/public-pr-$pr.json" <<JSON
          {
            "source_repository": "SamPetkov/Erdos",
            "source_pull_request": $pr,
            "source_head_sha": "$source_sha",
            "private_branch": "$branch",
            "base_ref": "$base_ref",
            "lean_validation": "$validation_state",
            "validation_run_id": "$GITHUB_RUN_ID"
          }
          JSON

            git add Erdos625 '*.md' .private-staging
            git commit -m "Stage and validate public Erdos PR #$pr at $source_sha"
            final_sha="$(git rev-parse HEAD)"
            git push --force origin "HEAD:refs/heads/$branch"
            publish_status "$final_sha" "$validation_state" "$validation_description"

            if test "$validation_rc" -ne 0; then
              echo "Validation failed for public PR #$pr; tail follows:" >&2
              tail -n 120 "$log" >&2 || true
            fi
          }

          branch34="staging/public-34-matching-restriction-product"
          branch35="staging/public-35-matching-restriction-envelope"
          branch37="staging/public-37-q-only-attachment-envelope"
          branch36="staging/public-36-section8-endpoint-transport-core"

          stage_pr 34 "$branch34" "$private_main" \
            "625/formalization/Erdos625/Section9MatchingRestrictionProduct.lean::Erdos625/Section9MatchingRestrictionProduct.lean" \
            "625/formalization/MATCHING_RESTRICTION_PRODUCT_AUDIT.md::MATCHING_RESTRICTION_PRODUCT_AUDIT.md"

          stage_pr 35 "$branch35" "$branch34" \
            "625/formalization/Erdos625/Section9MatchingRestrictionEnvelope.lean::Erdos625/Section9MatchingRestrictionEnvelope.lean" \
            "625/formalization/Erdos625/Section9ProfileAttachmentMatchingEnvelope.lean::Erdos625/Section9ProfileAttachmentMatchingEnvelope.lean" \
            "625/formalization/Erdos625/Section9ProfileAttachmentMatchingLogScale.lean::Erdos625/Section9ProfileAttachmentMatchingLogScale.lean" \
            "625/formalization/MATCHING_RESTRICTION_ENVELOPE_AUDIT.md::MATCHING_RESTRICTION_ENVELOPE_AUDIT.md"

          stage_pr 37 "$branch37" "$branch35" \
            "625/formalization/Erdos625/Section9MatchingRestrictionQOnly.lean::Erdos625/Section9MatchingRestrictionQOnly.lean" \
            "625/formalization/Erdos625/Section9ProfileAttachmentQOnly.lean::Erdos625/Section9ProfileAttachmentQOnly.lean" \
            "625/formalization/Erdos625/Section9ProfileAttachmentIntrinsicSplit.lean::Erdos625/Section9ProfileAttachmentIntrinsicSplit.lean" \
            "625/formalization/Erdos625/Section9QOnlyTwoRegimeAssembly.lean::Erdos625/Section9QOnlyTwoRegimeAssembly.lean" \
            "625/formalization/Q_ONLY_ATTACHMENT_ENVELOPE_AUDIT.md::Q_ONLY_ATTACHMENT_ENVELOPE_AUDIT.md"

          stage_pr 36 "$branch36" "$private_main" \
            "625/formalization/Erdos625/Section8EndpointTransportCore.lean::Erdos625/Section8EndpointTransportCore.lean" \
            "625/formalization/SECTION8_ENDPOINT_TRANSPORT_CORE_AUDIT.md::SECTION8_ENDPOINT_TRANSPORT_CORE_AUDIT.md"

          exit "$any_failed"

      - name: Preserve mirror validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erdos625-private-mirror-validation-${{ github.run_id }}
          path: mirror-validation-logs
          if-no-files-found: warn
          retention-days: 14

# This workflow changes only private staging branches and cannot push to the
# public repository. Staging-branch pushes do not recursively invoke it.
