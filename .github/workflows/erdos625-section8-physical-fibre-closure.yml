name: Erdős 625 Section 8 physical-fibre closure

on:
  pull_request:
    paths:
      - "625/formalization/Erdos625/Section8EndpointPhysicalBlockReverse.lean"
      - "625/formalization/Erdos625/Section8EndpointPhysicalCellReverse.lean"
      - "625/formalization/Erdos625/Section8EndpointPhysicalEquiv.lean"
      - "625/formalization/Erdos625/Section8PartialCellPhysicalFibre.lean"
      - "625/formalization/Erdos625/Section8AttainedDemandBlockSupport.lean"
      - "625/formalization/Erdos625/Section8FourDeficitProfileCover.lean"
      - "625/formalization/Erdos625/Section8AttainedAllDeficitReindexing.lean"
      - "625/formalization/Erdos625/Section8BareSkeletonClosure.lean"
      - "625/formalization/Erdos625/Section9QOnlySecondMomentFrontier.lean"
      - "625/formalization/SECTION8_PHYSICAL_FIBRE_CLOSURE_AUDIT.md"
      - "625/experiments/section8_physical_fibre_closure_regression.py"
      - ".github/workflows/erdos625-section8-physical-fibre-closure.yml"
  workflow_dispatch:

concurrency:
  group: erdos625-section8-physical-fibre-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Compile the exact closure regression
        run: python -m py_compile 625/experiments/section8_physical_fibre_closure_regression.py
      - name: Run the exact closure regression
        run: python 625/experiments/section8_physical_fibre_closure_regression.py
      - name: Run with Python optimization enabled
        run: python -O 625/experiments/section8_physical_fibre_closure_regression.py

  focused-lean-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Reject placeholders and project axioms in accepted closure modules
        shell: bash
        run: |
          files=(
            625/formalization/Erdos625/Section8EndpointPhysicalBlockReverse.lean
            625/formalization/Erdos625/Section8EndpointPhysicalCellReverse.lean
            625/formalization/Erdos625/Section8PartialCellPhysicalFibre.lean
          )
          for optional in \
            625/formalization/Erdos625/Section8EndpointPhysicalEquiv.lean \
            625/formalization/Erdos625/Section8AttainedDemandBlockSupport.lean \
            625/formalization/Erdos625/Section8FourDeficitProfileCover.lean \
            625/formalization/Erdos625/Section8AttainedAllDeficitReindexing.lean \
            625/formalization/Erdos625/Section8BareSkeletonClosure.lean; do
            if [[ -f "$optional" ]]; then files+=("$optional"); fi
          done
          if grep -nE \
            '(^|[[:space:]])(sorry|admit|sorryAx)([[:space:][:punct:]]|$)|^[[:space:]]*(axiom|constant|unsafe)[[:space:]]' \
            "${files[@]}"; then
              exit 1
          fi
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: 625/formalization
          auto-config: false
          build: false
          use-mathlib-cache: true
          use-github-cache: false
          nanoda: false
      - name: Build every accepted closure checkpoint warning-fatally
        working-directory: 625/formalization
        shell: bash
        run: |
          targets=(
            Erdos625.Section8EndpointPhysicalBlockReverse
            Erdos625.Section8EndpointPhysicalCellReverse
            Erdos625.Section8PartialCellPhysicalFibre
          )
          for optional in \
            Erdos625.Section8EndpointPhysicalEquiv \
            Erdos625.Section8AttainedDemandBlockSupport \
            Erdos625.Section8FourDeficitProfileCover \
            Erdos625.Section8AttainedAllDeficitReindexing \
            Erdos625.Section8BareSkeletonClosure; do
            path="${optional//./\/}.lean"
            path="${path#Erdos625\/}"
            if [[ -f "Erdos625/$path" ]]; then targets+=("$optional"); fi
          done
          : > /tmp/section8-physical-fibre-closure.log
          for target in "${targets[@]}"; do
            echo "=== $target ===" | tee -a /tmp/section8-physical-fibre-closure.log
            set +e
            lake build "$target" --wfail \
              >> /tmp/section8-physical-fibre-closure.log 2>&1
            status=$?
            set -e
            if [[ $status -ne 0 ]]; then
              tail -n 900 /tmp/section8-physical-fibre-closure.log
              exit $status
            fi
          done
          tail -n 900 /tmp/section8-physical-fibre-closure.log
      - name: Upload focused compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erdos625-section8-physical-fibre-closure-log
          path: /tmp/section8-physical-fibre-closure.log
          if-no-files-found: ignore
