name: Erdős 625 full proof audit

on:
  pull_request:
    paths:
      - "625/audits/FULL_THEOREM_LEMMA_AUDIT_2026-07-25.md"
      - "625/proofs/TRANSFERABLE_RESULTS_AND_COROLLARIES_2026-07-25.md"
      - "625/experiments/full_proof_audit_regression.py"
      - "625/formalization/Erdos625/Section8AllHighDeficitCellWeight.lean"
      - "625/formalization/Erdos625/Section8AllHighDeficitProductBound.lean"
      - ".github/workflows/erdos625-full-proof-audit.yml"
  workflow_dispatch:

concurrency:
  group: erdos625-full-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Compile audit checker
        run: python -m py_compile 625/experiments/full_proof_audit_regression.py
      - name: Run exact audit checks
        run: python 625/experiments/full_proof_audit_regression.py
      - name: Run audit checks with optimization enabled
        run: python -O 625/experiments/full_proof_audit_regression.py

  focused-section8-repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Reject placeholders and project axioms in repaired modules
        shell: bash
        run: |
          if grep -nE \
            '(^|[[:space:]])(sorry|admit|sorryAx)([[:space:][:punct:]]|$)|^[[:space:]]*(axiom|constant|unsafe)[[:space:]]' \
            625/formalization/Erdos625/Section8AllHighDeficitCellWeight.lean \
            625/formalization/Erdos625/Section8AllHighDeficitProductBound.lean; then
              exit 1
          fi
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: 625/formalization
          auto-config: false
          build: false
          use-mathlib-cache: true
          use-github-cache: false
          nanoda: false
      - name: Build the Section 8 simplification dependency closure warning-fatally
        working-directory: 625/formalization
        shell: bash
        run: |
          set +e
          lake build Erdos625.Section8SimplificationCore --wfail \
            > /tmp/erdos625-full-audit-lean.log 2>&1
          status=$?
          tail -n 500 /tmp/erdos625-full-audit-lean.log
          exit $status
      - name: Upload focused compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erdos625-full-audit-lean-log
          path: /tmp/erdos625-full-audit-lean.log
          if-no-files-found: ignore
