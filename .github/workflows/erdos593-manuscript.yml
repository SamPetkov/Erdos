name: Erdős 593 manuscript

on:
  push:
    paths:
      - "arxiv_preprints/arxiv_593/**"
      - "arxiv_preprints/Erdos593_revised.tex"
      - "arxiv_preprints/Erdos593_revised.md"
      - "arxiv_preprints/Erdos593_revised_source.zip"
      - "arxiv_preprints/arxiv_593.pdf"
      - ".github/workflows/erdos593-manuscript.yml"
  pull_request:
    paths:
      - "arxiv_preprints/arxiv_593/**"
      - "arxiv_preprints/Erdos593_revised.tex"
      - "arxiv_preprints/Erdos593_revised.md"
      - "arxiv_preprints/Erdos593_revised_source.zip"
      - "arxiv_preprints/arxiv_593.pdf"
      - ".github/workflows/erdos593-manuscript.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install TeX and PDF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils texlive-fonts-extra texlive-fonts-recommended \
            texlive-latex-extra texlive-science

      - name: Verify the 593 mirrors and source archive
        shell: bash
        run: |
          set -euo pipefail
          cmp arxiv_preprints/arxiv_593/main.tex arxiv_preprints/Erdos593_revised.tex
          cmp arxiv_preprints/arxiv_593/main.md arxiv_preprints/Erdos593_revised.md
          cmp arxiv_preprints/arxiv_593/main.pdf arxiv_preprints/arxiv_593.pdf

          python3 - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path("arxiv_preprints")
          with zipfile.ZipFile(root / "Erdos593_revised_source.zip") as archive:
              members = archive.namelist()
              if members != ["main.tex"]:
                  raise SystemExit(f"unexpected 593 source ZIP members: {members}")
              if archive.read("main.tex") != (root / "arxiv_593/main.tex").read_bytes():
                  raise SystemExit("593 source ZIP is stale")
          print("verified 593 source and publication mirrors")
          PY

      - name: Rebuild the canonical 593 manuscript cleanly
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          cp arxiv_preprints/arxiv_593/main.tex "$build_dir"/
          cd "$build_dir"
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex

          if grep -nEi \
            '(undefined references|Citation .* undefined|Reference .* undefined|There were undefined|Rerun to get|Label\(s\) may have changed)' \
            main.log; then
            exit 1
          fi

          rebuilt_pages="$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
          committed_pages="$(pdfinfo "$GITHUB_WORKSPACE/arxiv_preprints/arxiv_593/main.pdf" | awk '/^Pages:/ {print $2}')"
          test -n "$rebuilt_pages"
          test "$rebuilt_pages" -eq "$committed_pages"
          pdftotext -layout main.pdf rebuilt.txt
          pdftotext -layout "$GITHUB_WORKSPACE/arxiv_preprints/arxiv_593/main.pdf" committed.txt
          python3 - <<'PY'
          from pathlib import Path
          import unicodedata

          def normalized_text(path: str) -> str:
              text = unicodedata.normalize(
                  "NFKC",
                  Path(path).read_text(encoding="utf-8", errors="strict"),
              )
              return "".join(character.casefold() for character in text if character.isalnum())

          rebuilt = normalized_text("rebuilt.txt")
          committed = normalized_text("committed.txt")
          if rebuilt != committed:
              raise SystemExit(
                  "committed PDF alphanumeric text stream differs from the clean rebuild"
              )
          print("verified committed PDF text against the clean rebuild")
          PY

          pdffonts main.pdf >fonts.txt
          awk '
            NR > 2 && NF {seen = 1; if ($(NF - 4) != "yes") bad = 1}
            END {exit (!seen || bad)}
          ' fonts.txt

      - name: Upload verified manuscript
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erdos-593-manuscript
          path: arxiv_preprints/arxiv_593/main.pdf
          if-no-files-found: error
