name: Erdős 625 standard definitions and terminology

on:
  pull_request:
    paths:
      - "625/audits/STANDARD_DEFINITIONS_AND_TERMINOLOGY_AUDIT_2026-07-27.md"
      - "625/arxiv/STANDARD_DEFINITIONS_INSERT_V2.tex"
      - "625/arxiv/main.tex"
      - "625/arxiv/references.bib"
      - "625/experiments/check_standard_definitions.py"
      - "625/experiments/standard_definition_regression.py"
      - "625/formalization/Erdos625/Section9CyclePolymerBound.lean"
      - "625/formalization/Erdos625/Section8UnlabelledTypedSkeleton.lean"
      - "625/formalization/Erdos625/ConfigurationModelProbability.lean"
      - ".github/workflows/erdos625-standard-definitions.yml"
  workflow_dispatch:

concurrency:
  group: erdos625-standard-definitions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terminology-source-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Compile source checker
        run: python -m py_compile 625/experiments/check_standard_definitions.py
      - name: Check definitions, citations, and Lean alignment
        run: python 625/experiments/check_standard_definitions.py
      - name: Repeat source checker under optimized Python
        run: python -O 625/experiments/check_standard_definitions.py

  exact-definition-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Compile exact regression
        run: python -m py_compile 625/experiments/standard_definition_regression.py
      - name: Run exact finite definition regression
        shell: bash
        run: |
          python 625/experiments/standard_definition_regression.py \
            | tee /tmp/erdos625-standard-definition-regression.log
      - name: Repeat regression under optimized Python
        run: python -O 625/experiments/standard_definition_regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos625-standard-definition-regression
          path: /tmp/erdos625-standard-definition-regression.log
          if-no-files-found: error
