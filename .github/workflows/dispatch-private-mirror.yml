name: Dispatch the private 625 mirror

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-private-mirror.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch installed mirror workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mirror-public-erdos625-lean-prs.yml/dispatches" \
            --data '{"ref":"main"}'

# Updating this installed file deliberately emits one trusted dispatch.
