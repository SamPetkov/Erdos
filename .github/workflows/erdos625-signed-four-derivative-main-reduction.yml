name: Erdős 625 concrete signed four derivative corridor

on:
  pull_request:
    paths:
      - "625/formalization/Erdos625/SignedFourDerivativeMainReduction.lean"
      - "625/formalization/Erdos625/SignedFourDerivativeCompactBounds.lean"
      - "625/formalization/Erdos625/SignedFourDerivativeCorridor.lean"
      - ".github/workflows/erdos625-signed-four-derivative-main-reduction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-lean-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          if grep -nE \
            '(^|[[:space:]])(sorry|admit|sorryAx)([[:space:][:punct:]]|$)|^[[:space:]]*(axiom|constant|unsafe)[[:space:]]' \
            625/formalization/Erdos625/SignedFourDerivativeMainReduction.lean \
            625/formalization/Erdos625/SignedFourDerivativeCompactBounds.lean \
            625/formalization/Erdos625/SignedFourDerivativeCorridor.lean; then
            exit 1
          fi
      - id: lean_build
        continue-on-error: true
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: 625/formalization
          auto-config: false
          build: true
          build-args: --wfail Erdos625.SignedFourDerivativeCorridor
          use-mathlib-cache: true
          use-github-cache: false
          nanoda: false
      - name: Capture concise Lean diagnostics
        if: steps.lean_build.outcome == 'failure'
        working-directory: 625/formalization
        shell: bash
        run: |
          set +e
          lake build --wfail Erdos625.SignedFourDerivativeCorridor \
            > lean-build.log 2>&1
          status=$?
          grep -nE 'error:|unsolved goals|type mismatch|application type mismatch|unknown constant|declaration uses|unused variable|unexpected token' \
            lean-build.log > lean-errors.txt || true
          tail -n 900 lean-build.log > lean-tail.txt
          printf '%s\n' "$status" > lean-status.txt
          cat lean-errors.txt
      - name: Replay and audit theorem axioms
        if: steps.lean_build.outcome == 'success'
        working-directory: 625/formalization
        shell: bash
        run: |
          set +e
          lake env lean Erdos625/SignedFourDerivativeCorridor.lean \
            > lean-axioms.log 2>&1
          status=$?
          set -e
          cat lean-axioms.log
          test "$status" -eq 0
          if grep -Fq 'sorryAx' lean-axioms.log; then
            echo 'forbidden sorryAx dependency detected'
            exit 1
          fi
          for declaration in \
            signedFourSizeObjectiveDerivative_eq_quadraticMain_add_errors \
            abs_signedFourDerivativeRemainder_le \
            abs_signedFourSizeObjectiveDerivative_sub_quadraticMain_le \
            ProfileEntropyS4.continuousAt_tilt_fixed_score \
            continuousOn_fourGaussianTilt_admissibilityTargetCorridor \
            continuousOn_fourGaussianOptimizedValue_admissibilityTargetCorridor \
            signedFourAdmissibilityTargetCorridor_nonempty \
            exists_uniform_abs_fourGaussianTilt_bound \
            exists_uniform_abs_fourGaussianOptimizedValue_bound \
            exists_eventually_uniform_fourDeficit_tilt_and_logPartition_bound \
            exists_eventually_uniform_phaseFourDeficit_tilt_and_logPartition_bound \
            one_le_parts_and_parts_le_natCast_of_fourSizeTarget_mem_admissibilityCorridor \
            abs_log_parts_le_logOrder_of_range \
            factorialLogErrorBound_le_cast_add_four \
            abs_signedFourSizeObjectiveDerivative_sub_quadraticMain_le_corridorRadius \
            exists_eventually_uniform_signedFourDerivative_corridorRadius \
            tendsto_phaseNat_cast_div_logOrder \
            tendsto_signedFourNormalizedDerivativeQuadraticMain \
            tendsto_signedFourNormalizedDerivativeCorridorRadius_zero \
            tendsto_signedFourNormalizedDerivativeSlopeLower \
            tendsto_signedFourNormalizedDerivativeSlopeUpper \
            exists_signedFourDerivativeCorridor \
            eventually_exp_certifiedRate_mul_parts_lt_signedFourRootMidpointFirstMoment_of_positiveGap_rootEquations_centerLocalization_and_compactFeasibility; do
            grep -Fq "$declaration" lean-axioms.log || {
              echo "missing axiom report for $declaration"
              exit 1
            }
          done
      - name: Upload Lean diagnostics
        if: always() && steps.lean_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: signed-four-derivative-corridor-diagnostics
          path: |
            625/formalization/lean-build.log
            625/formalization/lean-errors.txt
            625/formalization/lean-tail.txt
            625/formalization/lean-status.txt
      - name: Stop after validation failure
        if: steps.lean_build.outcome == 'failure'
        run: exit 1
