name: Erdős 625 manuscript

on:
  push:
    paths:
      - "625/**"
      - ".github/workflows/erdos625-manuscript.yml"
  pull_request:
    paths:
      - "625/**"
      - ".github/workflows/erdos625-manuscript.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install TeX and PDF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils texlive-bibtex-extra texlive-fonts-extra \
            texlive-fonts-recommended texlive-latex-extra texlive-science

      - name: Check the canonical publication inventory and source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import zipfile

          root = pathlib.Path("625/arxiv")
          manifest = [
              line
              for line in (root / "MANIFEST.txt").read_text(encoding="utf-8").splitlines()
              if line
          ]
          if manifest != sorted(set(manifest)):
              raise SystemExit("MANIFEST.txt is not a sorted list of unique paths")
          actual = sorted(
              path.relative_to(root).as_posix() for path in root.rglob("*") if path.is_file()
          )
          if actual != manifest:
              raise SystemExit(
                  f"625/arxiv inventory differs from MANIFEST.txt: "
                  f"files={actual}, manifest={manifest}"
              )

          def digest(name):
              return hashlib.sha256((root / name).read_bytes()).hexdigest()

          ledger = (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines()
          expected = [f"{digest(name)}  {name}" for name in manifest if name != "SHA256SUMS"]
          if ledger != expected:
              raise SystemExit("SHA256SUMS does not match the files listed in MANIFEST.txt")

          package = json.loads((root / "SOURCE_PACKAGE.json").read_text(encoding="utf-8"))
          source_names = {"main.tex", "main.bbl", "references.bib", "petkov-preprint.sty"}
          if set(package["source_files_sha256"]) != source_names:
              raise SystemExit("SOURCE_PACKAGE.json lists unexpected source files")
          for name, value in package["source_files_sha256"].items():
              if digest(name) != value:
                  raise SystemExit(f"SOURCE_PACKAGE.json digest is stale: {name}")
          if digest("main.pdf") != package["pdf_sha256"]:
              raise SystemExit("SOURCE_PACKAGE.json PDF digest is stale")
          aliases = package["source_zip_aliases"]
          if "Erdos625_source.zip" not in aliases:
              raise SystemExit("Erdos625_source.zip is not a recorded source ZIP alias")
          for alias in aliases:
              if digest(alias) != package["source_zip_sha256"]:
                  raise SystemExit(f"source ZIP differs from SOURCE_PACKAGE.json: {alias}")
              with zipfile.ZipFile(root / alias) as archive:
                  members = archive.namelist()
                  if len(members) != len(set(members)) or set(members) != source_names:
                      raise SystemExit(f"unexpected source ZIP members in {alias}: {members}")
                  for name in source_names:
                      if archive.read(name) != (root / name).read_bytes():
                          raise SystemExit(f"source ZIP member is stale in {alias}: {name}")
          print(
              f"verified {len(manifest)}-file inventory, digest ledger, package record "
              f"and four-file source archives"
          )
          PY

      - name: Check manuscript source and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          tex=625/arxiv/main.tex
          test "$(grep -c '\\begin{maintheorem}' "$tex")" -eq 1
          test "$(grep -c '\\end{maintheorem}' "$tex")" -eq 1
          test "$(grep -cF 'OpenAI GPT-5.6 Sol' "$tex")" -eq 1
          python3 - "$tex" <<'PY'
          import pathlib
          import sys

          # Normalize whitespace so that line breaks inside the phrase do not matter.
          text = " ".join(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").split())
          count = text.count("Aristotle, Harmonic's automated theorem-proving system")
          if count != 1:
              raise SystemExit(f"expected one Aristotle disclosure, found {count}")
          PY
          ! grep -nF '\input{' "$tex"
          grep -qF '200/153' "$tex"
          if grep -nEi \
            '(proof remains conditional|candidate preprint|design hole|missing proof|unfinished theorem|ANTIGRAVITY|COMPLETE_WITH_ERRORS|ErdosProofClosed)' \
            "$tex"; then
            exit 1
          fi

          if git ls-files | grep -E \
            '(^|/)(AGENTS\.md|\.sync_erdos625|\.codex)(/|$)'; then
            exit 1
          fi
          if git ls-files 625 | grep -Ei \
            '(^|/)(private|proof[_-]?notes?|audits?|agent[_-]?artifacts?)(/|$)|\.(bak|orig|rej|tmp)$'; then
            exit 1
          fi

      - name: Rebuild from source with BibTeX in a clean directory
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          cp 625/arxiv/{main.tex,main.bbl,references.bib,petkov-preprint.sty} "$build_dir"/
          cd "$build_dir"
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex

          cmp main.bbl "$GITHUB_WORKSPACE/625/arxiv/main.bbl"
          if grep -nEi \
            '((LaTeX|Package|Class|pdfTeX)( [^:]+)? Warning:|undefined references|Citation .* undefined|Reference .* undefined|There were undefined|Rerun to get|Label\(s\) may have changed|multiply defined|Missing character|Overfull \\hbox|Overfull \\vbox|Underfull \\hbox|Underfull \\vbox)' \
            main.log; then
            exit 1
          fi

          rebuilt_pages="$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
          committed_pages="$(pdfinfo "$GITHUB_WORKSPACE/625/arxiv/main.pdf" | awk '/^Pages:/ {print $2}')"
          test -n "$rebuilt_pages"
          test -n "$committed_pages"
          # The runner's TeX Live and the distribution that produced the committed
          # PDF may break the final page differently; allow one page of difference.
          page_diff=$(( rebuilt_pages - committed_pages ))
          if [ "${page_diff#-}" -gt 1 ]; then
            echo "page count differs: rebuilt ${rebuilt_pages}, committed ${committed_pages}"
            exit 1
          fi
          test "$rebuilt_pages" -ge 40

          pdftotext -layout main.pdf rebuilt.txt
          pdftotext -layout "$GITHUB_WORKSPACE/625/arxiv/main.pdf" committed.txt
          test "$(wc -w <rebuilt.txt)" -ge 20000
          test "$(wc -w <committed.txt)" -ge 20000
          grep -qF '200/153' rebuilt.txt
          grep -qF '200/153' committed.txt

          pdffonts main.pdf >fonts.txt
          awk '
            NR > 2 && NF {seen = 1; if ($(NF - 4) != "yes") bad = 1}
            END {exit (!seen || bad)}
          ' fonts.txt
          pdffonts "$GITHUB_WORKSPACE/625/arxiv/main.pdf" >committed-fonts.txt
          awk '
            NR > 2 && NF {seen = 1; if ($(NF - 4) != "yes") bad = 1}
            END {exit (!seen || bad)}
          ' committed-fonts.txt

          cp main.pdf "$GITHUB_WORKSPACE/625/arxiv/ci-rebuilt-main.pdf"
          echo "verified ${rebuilt_pages} pages and $(wc -w <rebuilt.txt) extracted words"

      - name: Upload verified manuscript
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erdos-625-clean-rebuild
          path: 625/arxiv/ci-rebuilt-main.pdf
          if-no-files-found: error
