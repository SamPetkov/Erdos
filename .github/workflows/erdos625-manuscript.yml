name: Erdős 625 manuscript

on:
  push:
    paths:
      - "625/**"
      - ".github/workflows/erdos625-manuscript.yml"
  pull_request:
    paths:
      - "625/**"
      - ".github/workflows/erdos625-manuscript.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install TeX and PDF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils texlive-bibtex-extra texlive-fonts-extra \
            texlive-fonts-recommended texlive-latex-extra texlive-science

      - name: Check the canonical publication inventory and source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path("625/arxiv")
          expected_files = {
              "Erdos625_source.zip", "README.md", "main.bbl",
              "main.pdf", "main.tex", "references.bib",
          }
          actual_files = {path.name for path in root.iterdir() if path.is_file()}
          actual_dirs = {path.name for path in root.iterdir() if path.is_dir()}
          if actual_files != expected_files or actual_dirs:
              raise SystemExit(
                  f"unexpected 625/arxiv inventory: files={sorted(actual_files)}, "
                  f"directories={sorted(actual_dirs)}"
              )

          source_names = {"README.md", "main.bbl", "main.tex", "references.bib"}
          with zipfile.ZipFile(root / "Erdos625_source.zip") as archive:
              members = archive.namelist()
              if len(members) != len(set(members)) or set(members) != source_names:
                  raise SystemExit(f"unexpected source ZIP members: {members}")
              for name in source_names:
                  if archive.read(name) != (root / name).read_bytes():
                      raise SystemExit(f"source ZIP member is stale: {name}")
          print("verified six-file inventory and four-file source archive")
          PY

      - name: Check manuscript source and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          tex=625/arxiv/main.tex
          test "$(grep -c '\\begin{maintheorem}' "$tex")" -eq 1
          test "$(grep -c '\\end{maintheorem}' "$tex")" -eq 1
          ! grep -nF '\input{' "$tex"
          grep -qF '200/153' "$tex"
          if grep -nEi \
            '(proof remains conditional|candidate preprint|design hole|missing proof|unfinished theorem|ChatGPT|Aristotle|ANTIGRAVITY|COMPLETE_WITH_ERRORS|ErdosProofClosed)' \
            "$tex"; then
            exit 1
          fi

          if git ls-files | grep -E \
            '(^|/)(AGENTS\.md|\.sync_erdos625|\.codex)(/|$)'; then
            exit 1
          fi
          if git ls-files 625 | grep -Ei \
            '(^|/)(private|proof[_-]?notes?|audits?|agent[_-]?artifacts?)(/|$)|\.(bak|orig|rej|tmp)$'; then
            exit 1
          fi

      - name: Rebuild from source with BibTeX in a clean directory
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          cp 625/arxiv/{main.tex,main.bbl,references.bib,README.md} "$build_dir"/
          cd "$build_dir"
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex

          cmp main.bbl "$GITHUB_WORKSPACE/625/arxiv/main.bbl"
          if grep -nEi \
            '((LaTeX|Package|Class|pdfTeX)( [^:]+)? Warning:|undefined references|Citation .* undefined|Reference .* undefined|There were undefined|Rerun to get|Label\(s\) may have changed|multiply defined|Missing character|Overfull \\hbox|Overfull \\vbox|Underfull \\hbox|Underfull \\vbox)' \
            main.log; then
            exit 1
          fi

          rebuilt_pages="$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')"
          committed_pages="$(pdfinfo "$GITHUB_WORKSPACE/625/arxiv/main.pdf" | awk '/^Pages:/ {print $2}')"
          test -n "$rebuilt_pages"
          test "$rebuilt_pages" -eq "$committed_pages"
          test "$rebuilt_pages" -ge 40

          pdftotext -layout main.pdf rebuilt.txt
          pdftotext -layout "$GITHUB_WORKSPACE/625/arxiv/main.pdf" committed.txt
          python3 - <<'PY'
          from pathlib import Path
          import unicodedata

          def normalized_text(path: str) -> str:
              text = unicodedata.normalize(
                  "NFKC",
                  Path(path).read_text(encoding="utf-8", errors="strict"),
              )
              return "".join(character.casefold() for character in text if character.isalnum())

          rebuilt = normalized_text("rebuilt.txt")
          committed = normalized_text("committed.txt")
          if rebuilt != committed:
              raise SystemExit(
                  "committed PDF alphanumeric text stream differs from the clean rebuild"
              )
          print("verified committed PDF text against the clean rebuild")
          PY
          test "$(wc -w <rebuilt.txt)" -ge 20000
          grep -qF '200/153' rebuilt.txt

          pdffonts main.pdf >fonts.txt
          awk '
            NR > 2 && NF {seen = 1; if ($(NF - 4) != "yes") bad = 1}
            END {exit (!seen || bad)}
          ' fonts.txt

          echo "verified ${rebuilt_pages} pages and $(wc -w <rebuilt.txt) extracted words"

      - name: Upload verified manuscript
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erdos-625-manuscript
          path: 625/arxiv/main.pdf
          if-no-files-found: error
