name: Erdős 625 near-root full-gap manuscript

on:
  pull_request:
    paths:
      - "625/arxiv/AMS_NEAR_ROOT_DRAFT_V4.tex"
      - "625/arxiv/FRONTMATTER_INTRODUCTION_NEAR_ROOT_V4.tex"
      - "625/arxiv/PROOF_ARCHITECTURE_NEAR_ROOT_V4.tex"
      - "625/arxiv/SECTION5_NEAR_ROOT_PROFILE_V4.tex"
      - "625/arxiv/SECTION7_FULL_CORNER_NEAR_ROOT_V4.tex"
      - "625/arxiv/FINAL_ASSEMBLY_NEAR_ROOT_V4.tex"
      - "625/arxiv/FORMALIZATION_STATUS_NEAR_ROOT_ADDENDUM_2026_08_11_V4.tex"
      - "625/scripts/build_near_root_self_contained_v4.py"
      - "625/experiments/check_near_root_full_gap_v4.py"
      - "625/experiments/check_sharpened_transport_attachment_v4.py"
      - "625/audits/NEAR_ROOT_FULL_GAP_AUDIT_2026-08-11.md"
      - ".github/workflows/erdos625-near-root-full-gap.yml"
  workflow_dispatch:

concurrency:
  group: erdos625-near-root-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structural-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Compile near-root tools
        run: |
          python -m py_compile 625/scripts/build_near_root_self_contained_v4.py
          python -m py_compile 625/experiments/check_near_root_full_gap_v4.py
          python -m py_compile 625/experiments/check_sharpened_transport_attachment_v4.py
      - name: Replay sharpened Section 8--9 checker
        run: |
          python 625/experiments/check_sharpened_transport_attachment_v4.py \
            | tee /tmp/erdos625-sharp-section9.txt
          python -O 625/experiments/check_sharpened_transport_attachment_v4.py \
            | tee /tmp/erdos625-sharp-section9-optimized.txt
      - name: Replay near-root checker
        run: |
          python 625/experiments/check_near_root_full_gap_v4.py \
            | tee /tmp/erdos625-near-root.txt
          python -O 625/experiments/check_near_root_full_gap_v4.py \
            | tee /tmp/erdos625-near-root-optimized.txt
      - name: Upload theorem-facing sources and ledgers
        uses: actions/upload-artifact@v4
        with:
          name: erdos625-near-root-sources
          path: |
            625/arxiv/AMS_NEAR_ROOT_BODY_V4.generated.tex
            625/arxiv/FRONTMATTER_INTRODUCTION_NEAR_ROOT_V4.tex
            625/arxiv/PROOF_ARCHITECTURE_NEAR_ROOT_V4.tex
            625/arxiv/SECTION5_NEAR_ROOT_PROFILE_V4.tex
            625/arxiv/SECTION7_FULL_CORNER_NEAR_ROOT_V4.tex
            625/arxiv/FINAL_ASSEMBLY_NEAR_ROOT_V4.tex
            625/arxiv/FORMALIZATION_STATUS_NEAR_ROOT_ADDENDUM_2026_08_11_V4.tex
            /tmp/erdos625-sharp-section9.txt
            /tmp/erdos625-sharp-section9-optimized.txt
            /tmp/erdos625-near-root.txt
            /tmp/erdos625-near-root-optimized.txt
          if-no-files-found: error

  build-complete-pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install TeX and PDF inspection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-extra texlive-bibtex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-plain-generic poppler-utils
      - name: Generate near-root theorem-facing body
        run: python 625/scripts/build_near_root_self_contained_v4.py
      - name: Build near-root AMS manuscript
        working-directory: 625/arxiv
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error \
            AMS_NEAR_ROOT_DRAFT_V4.tex
      - name: Reject unresolved references and citations
        working-directory: 625/arxiv
        shell: bash
        run: |
          if grep -E \
              "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|There were undefined citations" \
              AMS_NEAR_ROOT_DRAFT_V4.log; then
            exit 1
          fi
      - name: Reject duplicate PDF destinations
        working-directory: 625/arxiv
        shell: bash
        run: |
          if grep -F "destination with the same identifier" \
              AMS_NEAR_ROOT_DRAFT_V4.log; then
            exit 1
          fi
      - name: Reject material overfull boxes
        working-directory: 625/arxiv
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path("AMS_NEAR_ROOT_DRAFT_V4.log").read_text(errors="replace")
          widths = [float(x) for x in re.findall(r"Overfull \\hbox \(([0-9.]+)pt too wide\)", log)]
          bad = [x for x in widths if x > 5.0]
          if bad:
              raise SystemExit(f"material overfull boxes: {bad}")
          print(f"overfull boxes above 5pt: {len(bad)}")
          PY
      - name: Verify full-paper size and extractability
        working-directory: 625/arxiv
        shell: bash
        run: |
          pages=$(pdfinfo AMS_NEAR_ROOT_DRAFT_V4.pdf | awk '/^Pages:/ {print $2}')
          test -n "$pages"
          if [ "$pages" -lt 48 ]; then
            echo "expected a full near-root paper, found only $pages pages"
            exit 1
          fi
          pdftotext AMS_NEAR_ROOT_DRAFT_V4.pdf /tmp/erdos625-near-root-v4.txt
          words=$(wc -w < /tmp/erdos625-near-root-v4.txt)
          if [ "$words" -lt 22000 ]; then
            echo "expected at least 22000 extracted words, found $words"
            exit 1
          fi
          echo "pages: $pages"
          echo "extracted words: $words"
      - name: Render representative pages
        working-directory: 625/arxiv
        run: |
          mkdir -p /tmp/erdos625-near-root-renders
          pages=$(pdfinfo AMS_NEAR_ROOT_DRAFT_V4.pdf | awk '/^Pages:/ {print $2}')
          for page in 1 5 15 25 35 45 "$pages"; do
            pdftoppm -f "$page" -singlefile -png -r 144 \
              AMS_NEAR_ROOT_DRAFT_V4.pdf \
              "/tmp/erdos625-near-root-renders/page-${page}"
          done
      - name: Upload complete near-root manuscript
        uses: actions/upload-artifact@v4
        with:
          name: erdos625-near-root-manuscript-v4
          path: |
            625/arxiv/AMS_NEAR_ROOT_DRAFT_V4.pdf
            625/arxiv/AMS_NEAR_ROOT_DRAFT_V4.log
            625/arxiv/AMS_NEAR_ROOT_BODY_V4.generated.tex
            625/arxiv/FRONTMATTER_INTRODUCTION_NEAR_ROOT_V4.tex
            625/arxiv/PROOF_ARCHITECTURE_NEAR_ROOT_V4.tex
            625/arxiv/SECTION5_NEAR_ROOT_PROFILE_V4.tex
            625/arxiv/SECTION7_FULL_CORNER_NEAR_ROOT_V4.tex
            625/arxiv/FINAL_ASSEMBLY_NEAR_ROOT_V4.tex
            625/arxiv/FORMALIZATION_STATUS_NEAR_ROOT_ADDENDUM_2026_08_11_V4.tex
            /tmp/erdos625-near-root-renders/*.png
          if-no-files-found: error
