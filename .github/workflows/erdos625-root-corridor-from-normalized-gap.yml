name: Erdős 625 root corridor from normalized gap

on:
  pull_request:
    paths:
      - "625/formalization/Erdos625/RootCorridorFromNormalizedGap.lean"
      - ".github/workflows/erdos625-root-corridor-from-normalized-gap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-lean-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          if grep -nE \
            '(^|[[:space:]])(sorry|admit|sorryAx)([[:space:][:punct:]]|$)|^[[:space:]]*(axiom|constant|unsafe)[[:space:]]' \
            625/formalization/Erdos625/RootCorridorFromNormalizedGap.lean; then
            exit 1
          fi
      - id: lean_build
        continue-on-error: true
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: 625/formalization
          auto-config: false
          build: true
          build-args: --wfail Erdos625.RootCorridorFromNormalizedGap
          use-mathlib-cache: true
          use-github-cache: false
          nanoda: false
      - name: Capture concise Lean diagnostics
        if: steps.lean_build.outcome == 'failure'
        working-directory: 625/formalization
        shell: bash
        run: |
          set +e
          lake build --wfail Erdos625.RootCorridorFromNormalizedGap \
            > lean-build.log 2>&1
          status=$?
          grep -nE 'error:|unsolved goals|type mismatch|application type mismatch|unknown constant|declaration uses|unused variable' \
            lean-build.log > lean-errors.txt || true
          tail -n 420 lean-build.log > lean-tail.txt
          printf '%s\n' "$status" > lean-status.txt
          cat lean-errors.txt
      - name: Replay and audit theorem axioms
        if: steps.lean_build.outcome == 'success'
        working-directory: 625/formalization
        shell: bash
        run: |
          set +e
          lake env lean Erdos625/RootCorridorFromNormalizedGap.lean \
            > lean-axioms.log 2>&1
          status=$?
          set -e
          cat lean-axioms.log
          test "$status" -eq 0
          if grep -Fq 'sorryAx' lean-axioms.log; then
            echo 'forbidden sorryAx dependency detected'
            exit 1
          fi
          for declaration in \
            tendsto_signedFourNormalizedRealPartCount_of_centerDisplacement_isBigO_logLogOrder \
            signedFour_leftRoot_centerDisplacement_eq \
            signedFour_leftRoot_centerDisplacement_isBigO_logLogOrder \
            tendsto_signedFourNormalizedLeftRootPartCount \
            eventually_signedFour_leftRoot_nonneg \
            signedFourRootGapUniformLower_pos \
            eventually_signedFourRootGapUniformLower_lt_normalizedGap \
            eventually_two_le_signedFourRootGapUniformLower_mul_scale \
            eventually_two_le_signedFourRootGap \
            signedFourNormalizedRootMidpointCenterDisplacement_isBigO_logLogOrder_of_right_and_rootGap; do
            grep -Fq "$declaration" lean-axioms.log || {
              echo "missing axiom report for $declaration"
              exit 1
            }
          done
      - name: Upload Lean diagnostics
        if: always() && steps.lean_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: root-corridor-from-normalized-gap-diagnostics
          path: |
            625/formalization/lean-build.log
            625/formalization/lean-errors.txt
            625/formalization/lean-tail.txt
            625/formalization/lean-status.txt
      - name: Stop after validation failure
        if: steps.lean_build.outcome == 'failure'
        run: exit 1
