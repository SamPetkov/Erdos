name: Erdős 625 Sections 8--9 simplification check

on:
  pull_request:
    paths:
      - "625/proofs/SECTIONS8_9_SIMPLIFIED_ROUTE.md"
      - "625/proofs/SECTION8_FORMALIZATION_FIRST_ALL_DEFICIT.md"
      - "625/proofs/SECTIONS8_9_CONCISE_REPLACEMENT.md"
      - "625/experiments/sections8_9_simplification_check.py"
      - "625/formalization/Erdos625/Section8SquareFreeAMGM.lean"
      - "625/formalization/Erdos625/Section8AllHighDeficitArithmetic.lean"
      - "625/formalization/Erdos625/Section8AllHighDeficitCellWeight.lean"
      - "625/formalization/Erdos625/Section8AllHighDeficitProductBound.lean"
      - "625/formalization/Erdos625/Section8SimplificationCore.lean"
      - ".github/workflows/erdos625-sections8-9-simplification-check.yml"
  workflow_dispatch:

concurrency:
  group: erdos625-sections8-9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Compile checker
        run: python -m py_compile 625/experiments/sections8_9_simplification_check.py
      - name: Run exact and diagnostic checks
        run: python 625/experiments/sections8_9_simplification_check.py
      - name: Run with optimization enabled
        run: python -O 625/experiments/sections8_9_simplification_check.py

  focused-lean-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          if grep -nE \
            '(^|[[:space:]])(sorry|admit|sorryAx)([[:space:][:punct:]]|$)|^[[:space:]]*(axiom|constant|unsafe)[[:space:]]' \
            625/formalization/Erdos625/Section8SquareFreeAMGM.lean \
            625/formalization/Erdos625/Section8AllHighDeficitArithmetic.lean \
            625/formalization/Erdos625/Section8AllHighDeficitCellWeight.lean \
            625/formalization/Erdos625/Section8AllHighDeficitProductBound.lean \
            625/formalization/Erdos625/Section8SimplificationCore.lean; then
            exit 1
          fi
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: 625/formalization
          auto-config: false
          build: false
          use-mathlib-cache: true
          use-github-cache: false
          nanoda: false
      - name: Build Section 8 simplification core warning-fatally
        working-directory: 625/formalization
        shell: bash
        run: |
          set +e
          lake build Erdos625.Section8SimplificationCore --wfail \
            > /tmp/section8-simplification-lean.log 2>&1
          status=$?
          tail -n 400 /tmp/section8-simplification-lean.log
          exit $status
      - name: Upload focused compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section8-simplification-lean-log
          path: /tmp/section8-simplification-lean.log
          if-no-files-found: ignore
